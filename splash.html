<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>جارٍ التحميل...</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 480px; height: 320px;
    background: transparent; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }
  .splash {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #0a3d6b 0%, #0d5fa8 55%, #1a6fad 100%);
    border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    animation: fadeIn .35s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
  .logo-circle {
    width: 76px; height: 76px; border-radius: 50%;
    background: rgba(255,255,255,.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; margin-bottom: 18px;
    border: 2px solid rgba(212,160,23,.6);
  }
  h1 { font-size: 17px; font-weight: 800; margin: 0 0 6px; }
  p { font-size: 12px; opacity: .8; margin: 0 0 22px; }
  .bar-track {
    width: 220px; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,.18); overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 40%; border-radius: 4px;
    background: #d4a017;
    animation: loading 1.1s ease-in-out infinite;
  }
  @keyframes loading {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(340%); }
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="logo-circle">🏫</div>
    <h1>نظام التقويم والاعتماد المدرسي</h1>
    <p>جارٍ التحميل، يرجى الانتظار...</p>
    <div class="bar-track"><div class="bar-fill"></div></div>
  </div>
</body>
</html>
